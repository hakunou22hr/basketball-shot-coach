name: Build and deploy GitHub Pages

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the pinned MediaPipe npm package
        run: npm install --ignore-scripts
      - name: Download the official Pose Landmarker Lite model
        run: |
          mkdir -p models
          curl --fail --location --retry 3 \
            https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task \
            --output models/pose_landmarker_lite.task
      - name: Copy and validate local AI assets
        run: |
          npm run prepare:mediapipe
          npm run build
          npm test
      - name: Prove that the Pages artifact contains nonempty AI files
        run: |
          find dist/mediapipe dist/wasm dist/models -maxdepth 1 -type f -printf '%p | %s bytes\n' | sort
          test "$(stat -c %s dist/models/pose_landmarker_lite.task)" -gt 1000000
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed AI assets return HTTP 200
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for asset in \
            mediapipe/vision_bundle.mjs \
            wasm/vision_wasm_internal.js \
            wasm/vision_wasm_internal.wasm \
            wasm/vision_wasm_nosimd_internal.js \
            wasm/vision_wasm_nosimd_internal.wasm \
            models/pose_landmarker_lite.task
          do
            url="${PAGE_URL%/}/$asset"
            curl --fail --location --retry 5 --retry-delay 5 --output /dev/null --show-error "$url"
            echo "HTTP 200: $url"
          done
